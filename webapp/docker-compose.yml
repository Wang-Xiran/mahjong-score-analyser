services:
  mahjong-app:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # OMV's host DNS is routed entirely through Tailscale's resolver
    # (100.100.100.100), which has shown intermittent "failed to fetch DNS
    # configuration" outages - pinning public resolvers here means scraping
    # doesn't go down with it.
    dns:
      - 1.1.1.1
      - 8.8.8.8
